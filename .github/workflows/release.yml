name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(python3 dev-port --version)" = "dev-port ${version}"
          test "$(python3 open-browser --version)" = "open-browser ${version}"

      - name: Prepare assets
        run: |
          mkdir -p dist
          cp dev-port open-browser dist/
          chmod +x dist/dev-port dist/open-browser
          cd dist
          sha256sum dev-port open-browser > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/dev-port \
            dist/open-browser \
            dist/checksums.txt \
            --generate-notes \
            --verify-tag
