name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "Makefile"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  LORE_VERSION: v0.13.0

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Lore
        run: |
          set -eu

          version="${LORE_VERSION#v}"
          archive="lore_${version}_linux_amd64.tar.gz"
          checksums="lore_${version}_checksums.txt"
          base="https://github.com/gi8lino/lore/releases/download/${LORE_VERSION}"

          curl --fail --silent --show-error --location \
            "${base}/${archive}" \
            -o "${RUNNER_TEMP}/${archive}"
          curl --fail --silent --show-error --location \
            "${base}/${checksums}" \
            -o "${RUNNER_TEMP}/${checksums}"

          cd "${RUNNER_TEMP}"
          grep " ${archive}$" "${checksums}" | sha256sum --check -
          tar -xzf "${archive}"
          test -x lore
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Build static documentation
        run: make site

      - name: Verify static output
        run: |
          test -s docs/site/index.html
          test -s docs/site/assets/css/app.css
          test -s docs/site/assets/js/static.js
          test -s docs/site/search-index.json
          test -s docs/site/sitemap.xml
          test -s docs/site/robots.txt
          test -f docs/site/.nojekyll

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
